{% extends "base.html" %}
{% block title %}Register — TotalVirus{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo"><i data-lucide="shield-plus"></i></div>
            <h2>Create Analyst Account</h2>
            <p>Register to track threat intelligence and scan logs.</p>
        </div>
        <form method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-with-icon">
                    <i data-lucide="user"></i>
                    <input type="text" id="username" name="username" placeholder="Choose a username" required autofocus>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-with-icon">
                    <i data-lucide="key-round"></i>
                    <input type="password" id="password" name="password" placeholder="Create password" required>
                    <button type="button" class="toggle-pw" onclick="togglePassword('password', this)">
                        <i data-lucide="eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-cyan btn-block">Create Account</button>
        </form>
        <div class="auth-footer">
            Already have an account? <a href="{{ url_for('login') }}">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
